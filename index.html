<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Interactive Quiz</title>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
  };
</script>
<style>

:root{ --bg:#f5f3ff; --panel:#ffffff; --text:#4c1d95; --muted:#a78bfa; --primary:#7c3aed; --primary2:#a78bfa; --border:color-mix(in srgb, var(--text) 18%, transparent); --option-bg:color-mix(in srgb, var(--panel) 88%, var(--primary) 12%); --option-hover:color-mix(in srgb, var(--panel) 80%, var(--primary) 20%); --option-active:color-mix(in srgb, var(--panel) 72%, var(--primary) 28%); --radius:16px; --app-font:'Noto Sans', 'Segoe UI', Tahoma, Arial, sans-serif; }
body{ margin:0; font-family:var(--app-font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; box-sizing:border-box; }
button,input,table,th,td,label,h1,h2,h3,p,div{ font-family:var(--app-font); }
.card{ background:var(--panel); width:100%; max-width:600px; border-radius:var(--radius); padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:1px solid var(--border); }
h1{ margin:0 0 10px; font-size:22px; text-align:center; } .desc{ color:var(--muted); font-size:13px; margin-bottom:20px; text-align:center; line-height:1.5; }
.quizLogoWrap{ width:162px; height:162px; border-radius:50%; overflow:hidden; margin:4px auto 18px; border:1px solid var(--border); background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; }
.quizLogo{ width:100%; height:100%; object-fit:cover; display:block; }
.loginIntro{ text-align:center; }
.loginForm{ width:100%; max-width:420px; margin:0 auto; }
.loginForm label{ text-align:left; }
.loginForm input{ text-align:left; }
.reviewBox{ margin-top:20px; border-top:1px solid var(--border); padding-top:18px; }
.reviewItem{ border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px; background:color-mix(in srgb, var(--panel) 90%, var(--primary) 10%); }
.badge{ display:inline-block; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:800; margin-bottom:8px; }
.badge.ok{ background:rgba(34,197,94,.16); color:var(--primary2); }
.badge.no{ background:rgba(239,68,68,.16); color:#ef4444; }
.reviewMeta{ font-size:13px; line-height:1.55; color:var(--text); }
.reviewMeta b{ color:var(--muted); }
label{ font-size:10px; text-transform:uppercase; font-weight:bold; color:var(--muted); margin-bottom:4px; display:block; }
.loginForm label{ font-size:12px; }
.loginForm input{ padding:10px 12px; }
input{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:color-mix(in srgb, var(--panel) 92%, var(--text) 8%); color:var(--text); margin-bottom:15px; box-sizing:border-box; outline:none; }
.loginForm input{ padding:10px 12px; }
.timerBox{ width:max-content; min-width:118px; margin:0 auto 14px; padding:8px 16px; border-radius:999px; background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, var(--panel) 82%), color-mix(in srgb, var(--primary2) 16%, var(--panel) 84%)); border:1px solid color-mix(in srgb, var(--primary) 42%, var(--border)); color:var(--primary2); font-size:17px; font-weight:800; letter-spacing:.04em; text-align:center; box-shadow:0 8px 22px rgba(0,0,0,.16); }
.timeEndNotice{ margin:0 0 16px; padding:12px 14px; border-radius:14px; background:color-mix(in srgb, #ef4444 12%, var(--panel) 88%); border:1px solid color-mix(in srgb, #ef4444 46%, var(--border)); color:var(--text); text-align:center; font-size:15px; font-weight:800; }
.btn{ background:var(--primary); color:#fff; border:none; padding:12px 20px; border-radius:10px; cursor:pointer; font-weight:800; width:100%; transition:0.2s; box-shadow:0 8px 18px rgba(0,0,0,.22); }
.btn:hover{ filter:brightness(1.1); }
.btn-back{ background:linear-gradient(135deg, var(--primary), var(--primary2)); color:#fff; border:1px solid rgba(255,255,255,.35); box-shadow:0 0 0 3px rgba(255,255,255,.10), 0 8px 22px rgba(0,0,0,.25); }
.btn-back:hover{ filter:brightness(1.18); box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 10px 26px rgba(0,0,0,.30); }
.opt{ display:block; padding:14px; border:1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); border-radius:10px; margin-bottom:10px; cursor:pointer; transition:0.2s; background:var(--option-bg); color:var(--text); font-weight:600; }
.opt:hover{ background:var(--option-hover); border-color:color-mix(in srgb, var(--primary) 55%, var(--border)); } .opt.active{ border-color:var(--primary); background:var(--option-active); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 24%, transparent); }
.bar{ height:6px; background:rgba(255,255,255,0.05); border-radius:3px; margin-bottom:20px; overflow:hidden; }
.fill{ height:100%; background:var(--primary); transition:width 0.3s; }
table{ width:100%; border-collapse:collapse; margin-top:15px; font-size:12px; }
th, td{ text-align:left; padding:8px; border-bottom:1px solid var(--border); }
@media (min-width: 901px){ body{ overflow:hidden; } .card{ max-height:calc(100vh - 40px); overflow:auto; } }

</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const DATA = {"title":"Interactive Quiz","desc":"Answer all questions and review your feedback at the end.","lang":"en","randQ":true,"randA":true,"saveData":true,"classLbl":"Class","sheetUrl":"","logoUrl":"","timerMinutes":0,"hasExplanation":true,"questions":[{"q":"During an incremental exercise test, as an athlete transitions from a light jog to a maximal sprint, why does the muscle shift its primary fuel reliance from fats toward carbohydrates?","choices":["Carbohydrates can be broken down to resynthesize ATP at a faster rate than fat oxidation.","Carbohydrates yield more total kilocalories per gram than fat molecules.","Intramuscular lipid stores are depleted within the first few seconds of physical exertion.","Fat oxidation produces large amounts of lactic acid, causing rapid muscle fatigue."],"answerIndex":0,"explain":"Carbohydrate metabolism yields ATP more rapidly than fat metabolism, meeting the higher rate of energy demand required by intense exercise.","rationales":["Carbohydrate metabolism yields ATP more rapidly than fat metabolism, meeting the higher rate of energy demand required by intense exercise.","Fats yield approximately 9 kcal/g, whereas carbohydrates yield only 4 kcal/g.","Body stores of subcutaneous and intramuscular fats are extensive and far exceed carbohydrate stores.","Lactic acid is a byproduct of anaerobic carbohydrate breakdown (glycolysis), not fat oxidation."]},{"q":"Anaerobic glycolysis yields a net of 2 ATP molecules when starting from blood glucose, but yields a net of 3 ATP molecules when starting from muscle glycogen. What accounts for this difference in net energy yield?","choices":["Glycogen breakdown activates oxygen-dependent pathways during the energy generation phase.","Glycogen breakdown bypasses the first ATP-consuming phosphorylation step required for blood glucose.","Blood glucose produces two molecules of lactic acid, whereas glycogen produces none.","Muscle glycogen produces four pyruvate molecules per substrate instead of two."],"answerIndex":1,"explain":"Glycogen is converted to glucose-6-phosphate via glycogenolysis without requiring an initial ATP investment step that blood glucose must undergo.","rationales":["Anaerobic glycolysis operates independently of oxygen regardless of whether glucose or glycogen is the starting fuel.","Glycogen is converted to glucose-6-phosphate via glycogenolysis without requiring an initial ATP investment step that blood glucose must undergo.","Both substrates lead to lactate formation under anaerobic glycolytic conditions.","Both glucose and glycogen produce two pyruvate (or lactate) molecules per carbohydrate unit cleaved."]},{"q":"During explosive, short-duration exercise, phosphocreatine (PCr) is rapidly broken down to regenerate ATP. Which enzyme directly catalyzes the breakdown of PCr into creatine and inorganic phosphate?","choices":["ATPase","Creatine kinase","Succinate dehydrogenase","Lactate dehydrogenase"],"answerIndex":1,"explain":"Creatine kinase splits PCr into creatine and inorganic phosphate, releasing energy used to reattach phosphate to ADP.","rationales":["ATPase is responsible for hydrolyzing ATP into ADP and inorganic phosphate to release energy for contraction.","Creatine kinase splits PCr into creatine and inorganic phosphate, releasing energy used to reattach phosphate to ADP.","Succinate dehydrogenase is an oxidative enzyme involved in the Krebs cycle within mitochondria.","Lactate dehydrogenase catalyzes the conversion between pyruvate and lactate in glycolysis."]},{"q":"During high-intensity exercise lasting 1 to 2 minutes, the accumulation of hydrogen ions (H\n+\n) in the active muscle leads to fatigue primarily by which mechanism?","choices":["Preventing the conversion of pyruvic acid into lactic acid in the cytoplasm.","Forcing the muscle to shift immediately to fat oxidation as an alternative fuel.","Completely stopping the electron transport chain due to lack of coenzyme carriers.","Decreasing muscle pH, which inhibits key glycolytic enzymes and interferes with calcium binding."],"answerIndex":3,"explain":"Increased intracellular acidity impairs glycolytic enzyme activity and hinders calcium from binding to muscle fibers, impeding muscular contraction.","rationales":["Pyruvate accepts H\n+\nto form lactic acid precisely to buffer H\n+\naccumulation and allow glycolysis to continue temporarily.","High acidity slows down metabolic processes and cannot be circumvented by switching to slower fat oxidation during high-intensity work.","The accumulation of H\n+\nin anaerobic glycolysis occurs in the cytoplasm and affects contraction and enzymes directly before severe electron transport chain limitation occurs.","Increased intracellular acidity impairs glycolytic enzyme activity and hinders calcium from binding to muscle fibers, impeding muscular contraction."]},{"q":"In the oxidative energy system, what is the specific role played by molecular oxygen (O\n2\n​\n\n) at the conclusion of the electron transport chain?","choices":["It hydrolyzes ATP to supply energy for pumping protons across the intermembrane space.","It reacts with pyruvate in the cytosol to create Acetyl-CoA.","It accepts electrons and combines with free protons (H\n+\n) to form water.","It binds directly to glycogen to initiate glycogenesis."],"answerIndex":2,"explain":"Oxygen serves as the final electron acceptor in the mitochondrial matrix, forming H 2 ​ O and keeping the electron transport chain functioning.","rationales":["Proton pumping is driven by the energy released as electrons pass down transport complexes, not by oxygen hydrolyzing ATP.","Pyruvate conversion to Acetyl-CoA occurs as it enters the mitochondria, but oxygen itself is not consumed directly in that reaction step.","Oxygen serves as the final electron acceptor in the mitochondrial matrix, forming H\n2\n​\n\nO and keeping the electron transport chain functioning.","Glycogenesis is the synthesis of glycogen from glucose and is an anabolic storage process, not an oxygen-driven oxidative step."]},{"q":"An exercise physiologist designs a workout to train an athlete's lactate tolerance. Which work-to-rest ratio is most appropriate for forcing lactate accumulation and conditioning the body to manage high acidity?","choices":["1:10 or 1:12","1:6","1:20","1:1 or 2:1"],"answerIndex":3,"explain":"Short rest intervals relative to work duration prevent complete lactate clearance, promoting adaptations in lactate tolerance.","rationales":["Work-to-rest ratios of 1:10 or 1:12 allow full phosphocreatine recovery, targeting the ATP-PCr system rather than lactate tolerance.","A 1:6 ratio provides sufficient rest for substantial recovery between bouts to clear lactate, rather than accumulating high tolerance levels.","A 1:20 ratio represents an excessively long recovery period that would fully clear metabolic byproducts between efforts.","Short rest intervals relative to work duration prevent complete lactate clearance, promoting adaptations in lactate tolerance."]},{"q":"When transitioning from rest to steady-state exercise, there is a delay in oxygen consumption known as the oxygen deficit. How is energy supplied during this initial period before aerobic metabolism reaches steady state?","choices":["By utilizing oxygen stored inside sarcoplasmic calcium reservoirs.","Through the immediate oxidation of intramuscular free fatty acids in the cytosol.","By breaking down muscular protein stores to produce amino acids for immediate oxidation.","Through rapid ATP resynthesis via the ATP-PCr system and anaerobic glycolysis."],"answerIndex":3,"explain":"Anaerobic pathways immediately cover the energy gap while cardiovascular and respiratory systems adjust to supply required oxygen.","rationales":["Sarcoplasmic calcium reservoirs store Ca\n2+\nfor muscle contraction triggers, not oxygen.","Fat oxidation requires mitochondria and oxygen, making it unable to meet immediate energy demands during the oxygen deficit lag.","Protein contributes minimally (<5-10%) to energy production and is not a primary rapid-response fuel at exercise onset.","Anaerobic pathways immediately cover the energy gap while cardiovascular and respiratory systems adjust to supply required oxygen."]},{"q":"Excess Postexercise Oxygen Consumption (EPOC) involves both rapid and prolonged recovery components. Which process specifically occurs during the rapid (early) phase of EPOC?","choices":["Resynthesis of intramuscular ATP and phosphocreatine (PCr) stores.","Sustained elevation of circulating catecholamines and thyroid hormones.","Metabolic clearance of elevated body temperature back to baseline.","Gluconeogenesis converting lactate to glucose in the liver via the Cori cycle."],"answerIndex":0,"explain":"The rapid component of EPOC focuses on quickly restoring high-energy phosphate stores and myoglobin oxygen levels within minutes.","rationales":["The rapid component of EPOC focuses on quickly restoring high-energy phosphate stores and myoglobin oxygen levels within minutes.","Hormonal normalization occurs gradually over the prolonged phase of recovery.","Body temperature elevation persists and contributes to the prolonged component of EPOC.","Lactate clearance and hepatic gluconeogenesis are slower processes operating during the extended recovery period."]},{"q":"Refer to the image displaying blood lactate levels relative to running speed before and after a training program. What physiological adaptation primarily causes the rightward shift in the Lactate Threshold (LT) after training?","choices":["Decreased reliance on fat oxidation, forcing greater reliance on anaerobic glycolysis at lower speeds.","A reduction in skeletal muscle capillary density, slowing down systemic oxygen delivery.","Inhibition of the Cori cycle, preventing lactate from being removed by active skeletal muscle and liver.","Enhanced mitochondrial density and oxidative enzyme activity, leading to greater lactate clearance and delayed accumulation."],"answerIndex":3,"explain":"Endurance adaptations increase oxidative capacity, allowing higher running speeds to be maintained aerobically before lactate rapidly accumulates in the blood.","rationales":["Training increases fat oxidation at given workloads, sparing glycogen and reducing lactate production.","Endurance training increases capillary density to improve oxygen delivery and metabolite clearance.","Training enhances lactate removal mechanisms, including transport to non-working muscles and liver via the Cori cycle.","Endurance adaptations increase oxidative capacity, allowing higher running speeds to be maintained aerobically before lactate rapidly accumulates in the blood."]},{"q":"Although 1 gram of fat yields 9 kcal of energy compared to 4 kcal for 1 gram of carbohydrate, fat oxidation requires more oxygen per molecule metabolized. What chemical characteristic explains this difference?","choices":["Free fatty acids contain a much higher ratio of carbon and hydrogen to oxygen atoms than carbohydrates.","Fat oxidation produces lactic acid as a high-energy intermediate during beta-oxidation.","Carbohydrates contain high proportions of nitrogen that reduce their caloric density.","Fatty acids skip the Krebs cycle entirely, reducing intermediate electron transfers."],"answerIndex":0,"explain":"Because fats contain proportionally fewer oxygen atoms in their molecular structure, more oxygen must be supplied externally to complete oxidation.","rationales":["Because fats contain proportionally fewer oxygen atoms in their molecular structure, more oxygen must be supplied externally to complete oxidation.","Fat oxidation produces Acetyl-CoA, NADH, and FADH\n2\n​\n\n, never lactic acid.","Carbohydrates consist solely of carbon, hydrogen, and oxygen (C\n6\n​\n\nH\n12\n​\n\nO\n6\n​\n\n); nitrogen is found in proteins.","Fatty acids are broken down via beta-oxidation into Acetyl-CoA, which must enter the Krebs cycle."]}]}; 
const UI = {"name":"Full Name","class":"Class","start":"Start Quiz","next":"Next","back":"Back","finish":"Finish","retake":"Retake","rank":"Top 10 Ranking","saving":"Saving data...","result":"Result","q":"Q","tableName":"Name","tableClass":"Class","percent":"%","alertInfo":"Please fill in your details.","alertChoose":"Please choose an answer.","review":"Answer Review","questionLabel":"Question","answerLabel":"Answer","explanationLabel":"Explanation","correct":"Correct","incorrect":"Incorrect","feedbackCorrect":"Correct answer, no comment.","feedbackWrong":"Your answer does not match the key concept.","noRefNote":"No explanation was found in the uploaded question file.","timeEnd":"Time End"};
let state = { mode:'login', idx:0, ans:[], name:'', class:'', qs:[], loading:false, ranking:[], endTime:0, remaining:0, timeEnded:false };
let timerInterval = null;
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatTime(ms){ const total = Math.max(0, Math.ceil(ms/1000)); const m = Math.floor(total/60); const s = total % 60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
function startTimer(){ if(timerInterval) clearInterval(timerInterval); if(!DATA.timerMinutes) return; state.endTime = Date.now() + DATA.timerMinutes * 60000; timerInterval = setInterval(() => { state.remaining = state.endTime - Date.now(); if(state.remaining <= 0){ clearInterval(timerInterval); timerInterval = null; state.timeEnded = true; finish(); } else if(state.mode === 'quiz') { const el = document.getElementById('timerBox'); if(el) el.textContent = formatTime(state.remaining); } }, 1000); }
function timerHtml(){ return DATA.timerMinutes && state.mode === 'quiz' ? '<div class="timerBox" id="timerBox">' + formatTime(state.endTime - Date.now()) + '</div>' : ''; }
function buildReview(){
  return '<div class="reviewBox"><h3 style="text-align:center; margin:0 0 12px;">' + UI.review + '</h3>' +
    state.qs.map((q,i) => {
      const picked = state.ans[i];
      const ok = picked === q.answerIndex;
      const userAns = picked === null || picked === undefined ? '-' : q.choices[picked];
      const selectedRationale = q.rationales && picked !== null && picked !== undefined ? q.rationales[picked] : "";
      const correctRationale = q.rationales ? q.rationales[q.answerIndex] : "";
      const fb = selectedRationale || correctRationale || q.explain || (ok ? UI.feedbackCorrect : UI.feedbackWrong + " " + UI.noRefNote);
      return '<div class="reviewItem">' +
        '<span class="badge ' + (ok ? 'ok' : 'no') + '">' + (ok ? UI.correct : UI.incorrect) + '</span>' +
        '<div class="reviewMeta"><b>' + UI.questionLabel + ':</b> ' + esc(q.q) + '</div>' +
        '<div class="reviewMeta"><b>' + UI.answerLabel + ':</b> ' + esc(userAns) + '</div>' +
        '<div class="reviewMeta"><b>' + UI.explanationLabel + ':</b> ' + esc(fb) + '</div>' +
      '</div>';
    }).join('') + '</div>';
}

function render(){
  const app = document.getElementById('app');
  if(state.mode==='login'){
    const logoHtml = DATA.logoUrl ? '<div class="quizLogoWrap"><img class="quizLogo" src="' + esc(DATA.logoUrl) + '" alt="Logo"></div>' : '';
    app.innerHTML = '<div class="loginIntro">' + logoHtml + '<h1>' + DATA.title + '</h1><p class="desc">' + DATA.desc + '</p></div>' +
      '<div class="loginForm"><label>' + UI.name + '</label><input type="text" id="u_name" value="' + esc(state.name) + '">' +
      '<label>' + UI.class + '</label><input type="text" id="u_class" value="' + esc(state.class) + '">' +
      '<button class="btn" onclick="start()">' + UI.start + '</button></div>';
  } else if(state.mode==='quiz'){
    const q = state.qs[state.idx];
    const backBtn = state.idx > 0 ? '<button class="btn btn-back" style="margin-top:10px;" onclick="back()">' + UI.back + '</button>' : '';
    const finishBtn = state.idx === state.qs.length - 1 ? '<button class="btn" style="margin-top:10px;" onclick="next()">' + UI.finish + '</button>' : '';
    app.innerHTML = timerHtml() + '<div class="bar"><div class="fill" style="width:' + ((state.idx)/state.qs.length)*100 + '%"></div></div>' +
      '<div style="font-size:11px; color:var(--muted); margin-bottom:10px;">' + UI.q + ' ' + (state.idx+1) + ' / ' + state.qs.length + '</div>' +
      '<h2 style="font-size:17px; margin-bottom:20px;">' + q.q + '</h2>' +
      q.choices.map((c,i) => '<div class="opt ' + (state.ans[state.idx]===i?'active':'') + '" onclick="setAns(' + i + ')">' + c + '</div>').join('') +
      finishBtn + backBtn;
  } else if(state.mode==='result'){
    let score = state.ans.reduce((acc, a, i) => acc + (a === state.qs[i].answerIndex ? 1 : 0), 0);
    let pct = Math.round((score/state.qs.length)*100);
    let html = '<h1>' + UI.result + '</h1>' + (state.timeEnded ? '<div class="timeEndNotice">' + UI.timeEnd + '</div>' : '') + '<div style="font-size:48px; font-weight:900; color:var(--primary2);">' + pct + '% (' + score + '/' + state.qs.length + ')</div>';
    html += buildReview();
    if(DATA.saveData){
      html += '<div style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;"><h3 style="text-align:center;">' + UI.rank + '</h3>';
      if(state.loading) html += '<p>' + UI.saving + '</p>';
      else if(state.ranking.length > 0) {
        html += '<table><tr><th>#</th><th>' + UI.tableName + '</th><th>' + UI.tableClass + '</th><th>' + UI.percent + '</th></tr>' + 
          state.ranking.map((r,i) => '<tr><td>' + (i+1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.class) + '</td><td>' + esc(r.percent) + '</td></tr>').join('') + '</table>';
      }
      html += '</div>';
    }
    html += '<button class="btn" style="margin-top:20px;" onclick="location.reload()">' + UI.retake + '</button>';
    app.innerHTML = html;
  }
  if (window.MathJax && window.MathJax.typeset) window.MathJax.typeset();
}
function start(){
  state.name = document.getElementById('u_name').value.trim(); 
  state.class = document.getElementById('u_class').value.trim();
  if(!state.name || !state.class) return alert(UI.alertInfo);
  state.qs = JSON.parse(JSON.stringify(DATA.questions));
  if(DATA.randQ) state.qs.sort(() => Math.random()-0.5);
  if(DATA.randA) state.qs.forEach(q => {
    const originalCorrect = q.choices[q.answerIndex];
    const rationales = Array.isArray(q.rationales) ? q.rationales : [];
    const pairs = q.choices.map((choice, idx) => ({ choice, rationale: rationales[idx] || "" }));
    pairs.sort(() => Math.random()-0.5);
    q.choices = pairs.map(p => p.choice);
    q.rationales = pairs.map(p => p.rationale);
    q.answerIndex = q.choices.indexOf(originalCorrect);
  });
  state.ans = new Array(state.qs.length).fill(null);
  state.timeEnded = false;
  state.mode = 'quiz'; startTimer(); render();
}
function setAns(i){ state.ans[state.idx] = i; if(state.idx < state.qs.length - 1){ state.idx++; } render(); }
function back(){ if(state.idx > 0){ state.idx--; render(); } }
function next(){
  if(state.ans[state.idx]===null) return alert(UI.alertChoose);
  if(state.idx < state.qs.length - 1){ state.idx++; render(); }
  else { finish(); }
}
async function finish(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  state.mode = 'result'; render();
  if(DATA.saveData && DATA.sheetUrl){
    state.loading = true; render();
    let score = state.ans.reduce((acc, a, i) => acc + (a === state.qs[i].answerIndex ? 1 : 0), 0);
    let pct = Math.round((score/state.qs.length)*100);
    try {
      await fetch(DATA.sheetUrl, { method:'POST', body: JSON.stringify({name:state.name, class:state.class, score:score, percent:pct}), mode:'no-cors' });
      setTimeout(async () => {
        try { const res = await fetch(DATA.sheetUrl); state.ranking = await res.json(); render(); } catch(e){}
        state.loading = false; render();
      }, 1500);
    } catch(e){ state.loading = false; render(); }
  }
}
render();
</script>
</body></html>
